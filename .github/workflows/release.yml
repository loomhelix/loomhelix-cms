name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  plan:
    name: Find the package versions to release
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Find the versions that are not on npm or have no GitHub release
        id: plan
        run: echo "packages=$(node release/src/release.ts plan)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish the packages to npm and make the GitHub releases
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the repository with actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js with actions/setup-node v7.1.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install the pnpm version from package.json
        run: npm install --global "$(node --print "require('./package.json').packageManager")"
      - name: Install the dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the check, the tests, and the build
        run: pnpm ready
      - name: Run the package tests
        run: pnpm test:packages
      - name: Publish the packages with trusted publishing and make the releases
        run: node release/src/release.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
