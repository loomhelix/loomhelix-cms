packages:
  - apps/*
  - packages/*
  - spec
  - browser-tests
  - package-tests
  - release
  - test-site

catalogMode: prefer
minimumReleaseAge: 10080

catalog:
  '@changesets/cli': 3.0.3
  '@types/node': ^22.20.5
  ajv: ^8.20.0
  lit: ^3.3.3
  prosemirror-commands: ^1.7.2
  prosemirror-history: ^1.5.1
  prosemirror-keymap: ^1.2.3
  prosemirror-model: ^1.25.12
  prosemirror-state: ^1.4.4
  prosemirror-view: ^1.42.6
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
